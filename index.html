<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Escape the CREC: an English game for Unit 1 (Who am I?).">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Escape the CREC Neo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=JetBrains+Mono:wght@500&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: modern mobile-game UI. Glass HUD on top, one screen at a time (gate+intro, title, team, map+shop, VS, battle, clear, quest, victory+ending).
   Battle = arena card (team vs robot) above a warm-white question card.
   Single dark theme by choice: it is the game world. Everything students read is Lexend on warm white; the display face is only for short labels. */
:root{
  color-scheme: dark;
  --night:#15123A;
  --floor:#211C5A;
  --panel:#241F5E;
  --panel2:#2F2879;
  --line:rgba(255,255,255,.13);
  --cyan:#33D6FF;
  --amber:#FFC93C;
  --pink:#FF5FA2;
  --heart:#FF4D6D;
  --xp:#3EE08F;
  --violet:#9B7BFF;
  --text:#F4F1FF;
  --muted:#B9B3E6;
  --paper:#FFF9F0;
  --ink:#231C4A;
  --ink-soft:#615A86;
  --good:#1FA971;
  --good-soft:#DDF7EA;
  --bad:#E0475A;
  --bad-soft:#FFE3E6;
  --pixel:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Lexend",Verdana,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:24px;
  --shadow:0 22px 50px -16px rgba(6,3,32,.75);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background-color:var(--night); color:var(--text);
  background-image:
    radial-gradient(55% 45% at 8% 0%, rgba(98,64,230,.55) 0, transparent 70%),
    radial-gradient(45% 40% at 100% 18%, rgba(255,95,162,.22) 0, transparent 70%),
    radial-gradient(60% 50% at 50% 110%, rgba(51,214,255,.18) 0, transparent 70%);
  background-attachment:fixed;
  font-family:var(--body); font-size:18px; line-height:1.6; letter-spacing:.02em; word-spacing:.08em;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:12px 40px;
}
body.big{font-size:21px}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--cyan); outline-offset:3px}
.wrap{max-width:1020px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
svg.spr{display:block; overflow:visible}
.frame{border-radius:var(--r); box-shadow:var(--shadow), inset 0 0 0 1px var(--line)}
.pbox{background:linear-gradient(180deg,var(--panel2),var(--panel)); border-radius:var(--r)}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes idle{to{transform:translateY(-5px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse2{to{transform:scale(1.08)}}
.blink{animation:blink 1.4s ease-in-out infinite}

/* HUD */
.hud{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; background:rgba(36,31,94,.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:20px; padding:10px 16px}
.hud .who{display:flex; align-items:center; gap:10px; min-width:0}
.hud .who .mini{display:flex; align-items:flex-end; gap:0}
.hud .who .mini svg{width:22px; height:auto; margin-left:-4px}
.hud .who .mini svg:first-child{width:30px; margin-left:0}
.hud .tn{font-family:var(--pixel); font-size:1.05rem; color:var(--amber); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; letter-spacing:.03em}
.stat{display:flex; align-items:center; gap:7px; font-weight:700; font-size:.88rem; font-variant-numeric:tabular-nums}
.hearts{display:flex; gap:3px}
.hearts svg{width:22px; height:auto}
.xpbar{width:110px; height:12px; background:rgba(255,255,255,.12); border-radius:999px; position:relative; overflow:hidden}
.xpbar i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#3EE08F,#33D6FF); border-radius:999px; transition:width .5s}
.stat span[style*="width:18px"] svg{width:20px}
.combo{color:#fff; background:linear-gradient(90deg,#FF5FA2,#9B7BFF); padding:3px 10px; border-radius:999px; animation:pulse2 .5s ease-in-out infinite alternate}
.opts-bar{display:flex; flex-wrap:wrap; gap:6px}
.pill{border:1px solid var(--line); background:rgba(255,255,255,.07); border-radius:999px; padding:5px 12px; font-size:.78rem; font-weight:500; display:inline-flex; gap:6px; align-items:center; color:var(--text)}
.pill:hover{background:rgba(255,255,255,.13)}
.pill[aria-pressed="true"]{border-color:var(--cyan); color:var(--cyan); background:rgba(51,214,255,.14)}

/* buttons */
.btn{font-family:var(--pixel); font-size:1.1rem; letter-spacing:.04em; border:0; border-radius:16px; padding:13px 22px; color:var(--ink);
  background:linear-gradient(180deg,#FFE27F,#FFB21E); box-shadow:0 6px 0 #C47A0C, 0 14px 24px -8px rgba(255,170,30,.6);
  text-shadow:0 1px 0 rgba(255,255,255,.55); transition:transform .08s, box-shadow .08s, filter .15s; line-height:1.2}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(5px); box-shadow:0 1px 0 #C47A0C}
.btn.cy{background:linear-gradient(180deg,#8DEBFF,#1FB6E8); box-shadow:0 6px 0 #0F7FA8, 0 14px 24px -8px rgba(51,214,255,.55)}
.btn.cy:active:not(:disabled){box-shadow:0 1px 0 #0F7FA8}
.btn.pk{background:linear-gradient(180deg,#FF9AC6,#F2408C); color:#fff; text-shadow:0 1px 0 rgba(120,0,50,.3); box-shadow:0 6px 0 #A81F5E, 0 14px 24px -8px rgba(255,95,162,.55)}
.btn.pk:active:not(:disabled){box-shadow:0 1px 0 #A81F5E}
.btn.gh{background:rgba(255,255,255,.08); color:var(--text); box-shadow:inset 0 0 0 2px var(--line); text-shadow:none}
.btn:disabled{opacity:.45; box-shadow:none; filter:grayscale(.4)}

/* title */
.title{display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; padding:clamp(20px,5vw,44px) 12px}
.logo{font-family:var(--pixel); font-weight:400; font-size:clamp(3rem,11vw,6.2rem); line-height:.95; margin:0; letter-spacing:.02em;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFE27F 55%,#FFB21E 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 0 #5B2A9E) drop-shadow(0 18px 26px rgba(0,0,0,.45))}
.logo span{background:linear-gradient(180deg,#D4F7FF,#33D6FF); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub404{font-family:var(--pixel); font-size:clamp(1rem,2.6vw,1.3rem); letter-spacing:.08em; color:#fff; background:linear-gradient(90deg,#FF5FA2,#9B7BFF); padding:6px 18px; border-radius:999px; margin:0; transform:rotate(-3deg); box-shadow:0 8px 18px -6px rgba(255,95,162,.6)}
.tag{font-weight:700; font-size:clamp(.72rem,1.8vw,.85rem); letter-spacing:.16em; color:var(--muted); margin:0; line-height:1.8; text-transform:uppercase}
.lineup{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; justify-content:center}
.lineup svg{width:66px; height:auto}
.lineup > svg:nth-child(odd){animation:bob .6s ease-in-out infinite alternate}
.lineup > svg:nth-child(even){animation:bob .6s .3s ease-in-out infinite alternate}
.lineup .vs{font-family:var(--pixel); color:var(--pink); font-size:1.6rem; padding-bottom:24px}
.menu{display:flex; flex-direction:column; gap:14px; align-items:stretch; min-width:min(100%,300px)}

/* team screen */
.sel{display:flex; flex-direction:column; gap:18px; padding:clamp(18px,3vw,30px)}
.sel h2{font-family:var(--pixel); font-weight:400; font-size:clamp(1.6rem,4vw,2.2rem); margin:0; line-height:1.1; color:var(--amber); letter-spacing:.03em}
.heroes,.teamgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px}
.hero{background:rgba(255,255,255,.06); border:0; border-radius:20px; padding:16px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; box-shadow:inset 0 0 0 1px var(--line)}
.hero svg{width:88px; height:auto; animation:idle .8s ease-in-out infinite alternate}
.hero:nth-child(even) svg{animation-delay:.4s}
.hero b{font-family:var(--pixel); font-weight:400; font-size:1.3rem; letter-spacing:.04em}
.hero small{color:var(--muted); font-size:.85rem; line-height:1.4}
.teamgrid .hero input{font:inherit; font-size:.95rem; padding:7px 10px; border:0; background:var(--paper); color:var(--ink); border-radius:12px; width:100%; text-align:center}
.field{display:flex; flex-direction:column; gap:6px; max-width:420px}
.field label{font-weight:600}
.field input{font:inherit; font-size:1.1rem; padding:11px 14px; border:0; background:var(--paper); color:var(--ink); border-radius:14px}

/* dialog card */
.dialog{background:var(--paper); color:var(--ink); border-radius:var(--r); padding:clamp(18px,3vw,28px); display:flex; flex-direction:column; gap:16px; position:relative}
.speaker{position:absolute; top:-16px; left:22px; font-family:var(--pixel); font-size:1rem; letter-spacing:.05em; background:linear-gradient(90deg,#3A2E9E,#5B3FD1); color:var(--amber); padding:5px 14px; border-radius:999px; box-shadow:0 8px 16px -6px rgba(35,28,74,.6)}
.dialog .say{font-size:clamp(1.2rem,2.8vw,1.55rem); line-height:1.5; margin:0; max-width:46ch}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.row.end{justify-content:space-between}

/* map */
.mapwrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--r); overflow:hidden;
  background:radial-gradient(circle at 25% 30%, rgba(98,64,230,.45), transparent 50%), radial-gradient(circle at 80% 75%, rgba(51,214,255,.22), transparent 45%), linear-gradient(160deg,#2A2370,#1A1650);
  background-color:var(--floor)}
.mapwrap::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.12) 1.5px, transparent 1.5px); background-size:26px 26px}
.mapwrap.tall{aspect-ratio:3/4}
.mapwrap svg.path{position:absolute; inset:0; width:100%; height:100%}
.mapwrap svg.path polyline{stroke:rgba(255,255,255,.35); stroke-width:6; stroke-dasharray:.1 16; stroke-linecap:round}
.room{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:5px; border:0; background:none; padding:0; width:100px}
.room .tile{width:64px; height:64px; border-radius:20px; background:linear-gradient(180deg,#5A52B8,#3C3590); display:grid; place-items:center; box-shadow:0 6px 0 #251F66, 0 14px 22px -8px rgba(0,0,0,.6)}
.room .tile svg{width:32px; height:32px}
.room .nm{font-weight:700; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; line-height:1.4; text-align:center; color:var(--text); background:rgba(21,18,58,.75); padding:3px 9px; border-radius:999px}
.room.done .tile{background:linear-gradient(180deg,#4BE79E,#1FA971); box-shadow:0 6px 0 #127247, 0 14px 22px -8px rgba(0,0,0,.6)}
.room.now .tile{background:linear-gradient(180deg,#FFE27F,#FFB21E); box-shadow:0 6px 0 #C47A0C, 0 0 0 0 rgba(255,201,60,.5); animation:pulse 1.1s ease-in-out infinite alternate}
.room.now .nm{color:var(--amber)}
.room.lock .tile{background:linear-gradient(180deg,#6A63B8,#4A4396); box-shadow:0 6px 0 #2E2873, 0 14px 22px -8px rgba(0,0,0,.6)}
.room.lock .tile svg{opacity:.75}
.room.boss .tile{width:78px; height:78px; border-radius:24px; background:linear-gradient(180deg,#FF6B8A,#C92C55); box-shadow:0 6px 0 #861A3A, 0 14px 22px -8px rgba(0,0,0,.6)}
.room.boss.now .tile{background:linear-gradient(180deg,#FF9AC6,#F2408C)}
@keyframes pulse{to{box-shadow:0 6px 0 #C47A0C, 0 0 0 12px rgba(255,201,60,0)}}
.stars{font-size:.8rem; color:var(--amber); letter-spacing:.1em}
.avatar{position:absolute; transform:translate(-50%,-112%); transition:left .9s ease-in-out, top .9s ease-in-out; pointer-events:none; z-index:3}
.avatar .mini{display:flex; align-items:flex-end}
.avatar .mini svg{width:22px; height:auto; margin-left:-5px}
.avatar .mini svg:first-child{width:36px; margin-left:0; animation:bob .4s ease-in-out infinite alternate}
.maptools{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.maptools p{margin:0; font-size:1rem}
.shophead{display:flex; justify-content:space-between; align-items:center; padding:16px 18px 0; font-family:var(--pixel); font-size:1.3rem; letter-spacing:.04em; color:var(--amber)}
.shophead svg{width:20px}
.shop{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; padding:16px}
.item{background:rgba(255,255,255,.06); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:inset 0 0 0 1px var(--line)}
.item .top{display:flex; align-items:center; gap:12px}
.item .top svg{width:40px; height:auto}
.item b{font-family:var(--pixel); font-weight:400; font-size:1.05rem; letter-spacing:.04em; line-height:1.2}
.item p{margin:0; font-size:.88rem; color:var(--muted); line-height:1.4}
.item .btn{font-size:.95rem; padding:10px 14px}

/* VS */
.vsbox{position:relative; height:clamp(270px,46vw,390px); border-radius:var(--r); overflow:hidden; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  background:radial-gradient(circle at 25% 50%, rgba(51,214,255,.35), transparent 45%), radial-gradient(circle at 75% 50%, rgba(255,77,109,.4), transparent 45%), linear-gradient(110deg,#2E3FC9 0 49.4%, #fff 49.4% 50.6%, #C42A61 50.6%)}
.vsside{display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px; min-width:0}
.vsside > svg{width:clamp(100px,18vw,170px); height:auto; filter:drop-shadow(0 14px 18px rgba(0,0,0,.4))}
.vsside .party svg{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.vsside .nm{font-family:var(--pixel); font-size:clamp(1rem,2.4vw,1.5rem); letter-spacing:.04em; text-align:center; line-height:1.2; text-shadow:0 3px 0 rgba(0,0,0,.35)}
.vsl{animation:inl .55s cubic-bezier(.2,1.4,.4,1) both}
.vsr{animation:inr .55s .15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes inl{from{transform:translateX(-120%)}}
@keyframes inr{from{transform:translateX(120%)}}
.vsmid{font-family:var(--pixel); font-size:clamp(3rem,9vw,5rem); color:#fff; filter:drop-shadow(0 6px 0 #231C4A) drop-shadow(0 0 24px rgba(255,255,255,.6)); animation:vsin .45s .5s cubic-bezier(.2,1.8,.4,1) both; font-style:italic}
@keyframes vsin{from{transform:scale(4) rotate(-12deg); opacity:0}}
.vsroom{position:absolute; top:14px; left:0; right:0; text-align:center; font-weight:700; font-size:.75rem; letter-spacing:.16em; color:#fff; text-transform:uppercase; opacity:.85}

/* battle arena */
.arena{position:relative; height:clamp(220px,32vw,290px); border-radius:var(--r); overflow:hidden}
.arena::after{content:""; position:absolute; left:0; right:0; bottom:0; height:34%; background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.25)); border-top:2px solid rgba(255,255,255,.08); pointer-events:none}
.arena.p2{animation:redpulse 1s ease-in-out infinite alternate}
@keyframes redpulse{to{box-shadow:var(--shadow), inset 0 0 80px rgba(255,77,109,.6)}}
.arena .lvl{position:absolute; top:12px; left:14px; font-weight:700; font-size:.7rem; letter-spacing:.12em; color:var(--text); background:rgba(21,18,58,.6); padding:3px 10px; border-radius:999px; z-index:2}
.fighter{position:absolute; bottom:13%; display:flex; flex-direction:column; align-items:center; gap:10px; z-index:1}
.fighter.me{left:3%}
.fighter.bot{right:8%}
.fighter .sprw svg{width:clamp(84px,13vw,120px); height:auto; animation:idle .8s ease-in-out infinite alternate; filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.fighter.bot.boss .sprw svg{width:clamp(120px,19vw,175px)}
.party{display:flex; align-items:flex-end; gap:2px}
.pm{position:relative}
.pm svg{width:clamp(30px,5vw,48px); height:auto; opacity:.8}
.pm.on svg{width:clamp(60px,10vw,92px); opacity:1; animation:idle .7s ease-in-out infinite alternate; filter:drop-shadow(0 0 14px rgba(255,201,60,.55))}
.pm.on::after{content:""; position:absolute; top:-16px; left:50%; width:14px; height:14px; transform:translateX(-50%) rotate(45deg); background:var(--amber); border-radius:3px; animation:bob .45s ease-in-out infinite alternate}
.hp{width:clamp(110px,17vw,160px)}
.hp .lab{font-weight:700; font-size:.68rem; letter-spacing:.06em; color:var(--text); display:flex; justify-content:space-between; margin-bottom:4px; gap:6px; text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hp .bar{height:12px; background:rgba(0,0,0,.35); border-radius:999px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.hp .bar i{display:block; height:100%; background:linear-gradient(90deg,#FF4D6D,#FF8E5E); border-radius:999px; transition:width .4s}
.lunge{animation:lunge .45s ease}
@keyframes lunge{40%{transform:translateX(70px) scale(1.08)}}
.hurt{animation:hurt .45s ease}
@keyframes hurt{25%{transform:translateX(-10px) rotate(-4deg); filter:brightness(1.8) saturate(.4)}50%{transform:translateX(9px) rotate(3deg)}75%{transform:translateX(-4px); filter:brightness(1.6)}}
.zap{animation:zap .5s ease}
@keyframes zap{40%{transform:translateX(-70px) scale(1.08)}}
.dead{animation:die .9s ease forwards}
@keyframes die{to{transform:scale(1.4) rotate(14deg); opacity:0; filter:brightness(3) blur(4px)}}
.pop{position:absolute; font-family:var(--pixel); font-size:1.7rem; animation:popup 1s ease forwards; pointer-events:none; z-index:4; text-shadow:0 3px 0 #231C4A, 0 0 14px rgba(0,0,0,.4)}
.pop.crit{font-size:2.2rem}
@keyframes popup{from{transform:translateY(0) scale(1.3); opacity:1}to{transform:translateY(-60px) scale(1); opacity:0}}
.spark{position:absolute; width:9px; height:9px; border-radius:50%; z-index:3; pointer-events:none; animation:spark .65s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0}}
.whiteflash{position:absolute; inset:0; background:radial-gradient(circle,#fff,rgba(155,123,255,.6)); z-index:5; pointer-events:none; animation:wf .5s ease-out forwards}
@keyframes wf{from{opacity:.95}to{opacity:0}}
.bubble{position:absolute; top:14%; right:26%; max-width:42%; background:#fff; color:var(--ink); border-radius:16px; padding:7px 12px; font-size:.88rem; line-height:1.35; font-weight:600; z-index:3; animation:bubin .25s ease-out; box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.bubble::after{content:""; position:absolute; right:-9px; bottom:12px; border:7px solid transparent; border-left-color:#fff}
@keyframes bubin{from{transform:scale(.6); opacity:0}}

/* question card */
.qtop{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.turn{display:inline-flex; align-items:center; gap:8px; background:linear-gradient(90deg,#3A2E9E,#5B3FD1); color:var(--amber); font-family:var(--pixel); font-size:1rem; letter-spacing:.04em; padding:4px 14px 4px 6px; border-radius:999px; line-height:1.3}
.turn svg{width:26px; height:auto}
.meter{display:flex; align-items:center; gap:5px; font-weight:700; font-size:.7rem; letter-spacing:.12em; color:var(--ink-soft)}
.meter i{width:22px; height:10px; border-radius:999px; background:#E7E0F7}
.meter i.on{background:linear-gradient(90deg,#9B7BFF,#FF5FA2)}
.prompt{font-size:clamp(1.4rem,3.3vw,2rem); font-weight:500; line-height:1.4; margin:0; max-width:32ch}
.prompt .blank{display:inline-block; min-width:2.8em; border-bottom:4px solid var(--violet); margin:0 .12em}
.prompt b{color:#4A35C9; font-weight:600}
.tool{border:0; background:#EFEAFF; color:var(--ink); border-radius:12px; padding:7px 12px; display:inline-flex; gap:6px; align-items:center; font-size:.85rem; font-weight:600}
.tool:hover:not(:disabled){background:#E2DAFF}
.tool svg{width:18px; height:18px}
.tool:disabled{opacity:.4}
.tool.super{background:linear-gradient(90deg,#9B7BFF,#FF5FA2); color:#fff; animation:pulse2 .5s ease-in-out infinite alternate}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
.opt{border:2px solid #E7E0F7; background:#fff; color:var(--ink); border-radius:18px; padding:12px 14px; min-height:72px; display:flex; align-items:center; gap:12px; text-align:left; font-size:clamp(1.15rem,2.4vw,1.4rem); font-weight:600; box-shadow:0 5px 0 #DCD3F0; transition:transform .1s, border-color .15s}
.opt:hover:not(:disabled){border-color:var(--violet); transform:translateY(-2px)}

function makeLook(){
  const p={}; for(const k in VALS)p[k]=rnd(VALS[k]);
  const chosen=shuffle(['hair','face','freckles','beard','height']).slice(0,Math.random()<.5?2:3);
  const pron=p.beard?'He':(p.hairStyle==='ponytail'?'She':rnd(['He','She']));
  const parts=chosen.map(k=>phrase(k,p));
  const sentence=`${pron} ${parts.slice(0,-1).join(', ')} and ${parts[parts.length-1]}.`;
  const decoys=shuffle(chosen).slice(0,2).map(k=>{ const d={...p};
    if(k==='hair'){ if(p.hairStyle!=='bald'&&Math.random()<.5)d.hairColor=rnd(VALS.hairColor.filter(v=>v!==p.hairColor)); else d.hairStyle=rnd(VALS.hairStyle.filter(v=>v!==p.hairStyle)); }
    else if(k==='freckles'||k==='beard')d[k]=!p[k]; else d[k]=rnd(VALS[k].filter(v=>v!==p[k])); return d; });
  const opts=shuffle([{p,ok:1},...decoys.map(d=>({p:d,ok:0}))]);
  return {p:sentence, look:1, opts:opts.map(o=>o.p), a:opts.findIndex(o=>o.ok)};
}

function autoSay(){

function pickQs(lv,L){
  let seen={}; try{seen=JSON.parse(localStorage.getItem('crecSeenQ')||'{}')}catch(e){}
  const n=Math.min(L.pick||L.qs.length,L.qs.length); let used=seen[lv]||[];
  let chosen=shuffle(L.qs.filter(q=>!used.includes(q.p))).slice(0,n);
  if(chosen.length<n){ used=[]; chosen=chosen.concat(shuffle(L.qs.filter(q=>!chosen.includes(q))).slice(0,n-chosen.length)); }
  seen[lv]=used.concat(chosen.map(q=>q.p));
  try{localStorage.setItem('crecSeenQ',JSON.stringify(seen))}catch(e){}
  return chosen;
}

    S.state=S.prevState==='right'?'right':'ask'; render('super'); }
  if(a==='next') nextQ();
  if(a==='after'){ const done=S.level; if(!S.solo)S.hero=(S.hero+1)%HEROES.length; if(LEVELS[done].boss){ unlock('boss'); if(!S.used50)unlock('nohelp'); if(S.stars.reduce((x,y)=>x+y,0)>=21)unlock('legend'); S.screen='victory'; save(); playOutro(); return; }
    S.level=done+1; S.walkFrom=done; if(QUESTS[done]){ S.screen='quest'; S.qstep=0; S.qkey=done; } else S.screen='map'; render(); }
  if(a==='sayquest') say(QUESTS[S.qkey][S.qstep]);
  if(a==='questdone'){ S.xp+=20; sfx('quest'); const list=QUESTS[S.qkey]; if(S.qstep<list.length-1){S.qstep++; render();} else { S.screen='map'; render(); } }
  if(a==='quit'){ if(S.screen!=='victory')save(); else { try{localStorage.removeItem('crecneo1')}catch(_){} } S.screen='title'; render(); }
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(!$('#intro').hidden){ if(e.key==='Escape'){ outroOn?endOutro():endIntro(); } return; }
  if(S.screen==='battle'&&['1','2','3'].includes(e.key)){ const b=document.querySelector(`.opt[data-o="${+e.key-1}"]`); if(b&&!b.disabled)answer(+e.key-1); }
  if(e.key==='Enter'&&document.activeElement===document.body){ const b=document.querySelector('#nextbtn, .dialog .btn, .center .btn, .quest .btn, .maptools .btn:last-child, .sel .btn, .title .btn'); if(b){e.preventDefault(); b.click();} }
});
let lastHover=null; document.addEventListener('pointerover',e=>{ const o=e.target.closest('.opt,.btn,.room,.hero'); if(o&&o!==lastHover&&!o.disabled){ lastHover=o; sfx('blip'); } else if(!o) lastHover=null; });
document.addEventListener('input',e=>{ if(e.target.id==='team')S.team=e.target.value; if(e.target.dataset.pl!==undefined)S.players[+e.target.dataset.pl]=e.target.value; });
let rz; window.addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{ if(S.screen==='map')render(); },200)});
try{speechSynthesis.getVoices()}catch(e){}
render();
showGate();
</script>
